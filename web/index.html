  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="ic-xxx" viewBox="0 0 24 24">。
    2. symbol 内部的 path 不写 fill/stroke，由引用方（<svg><use href="/icons.svg#ic-xxx"></use></svg>）
       上的 fill="none" stroke="currentColor" 继承下来，因此颜色随文字颜色自动变化。
    3. 线条统一 24x24 视框、圆角端点，与 CSS 中 --ld-stroke 保持一致。
  使用方式（ld-icon 组件已封装）：
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <use href="/icons.svg#ic-folder"></use>
