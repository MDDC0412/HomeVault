# =============================================================================
# homevault 反向代理 —— Nginx
#
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/homevault.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 四条**必须**记住的规则（前三条写错会直接导致大文件上传失败或磁盘翻倍）：
#
#   1. client_max_body_size 0;        不限制请求体大小（0 = 不限，不是 0 字节）。
#                                     上限交给 homevault 的 maxUploadSize 与配额控制。
#   2. proxy_request_buffering off;   不缓冲请求体。默认 Nginx 会先把整个请求体
#                                     落盘到临时目录再转发，导致磁盘写两遍、进度失真。
#   3. proxy_read_timeout / send_timeout 3600s;   大文件传输可能持续很久。
#   4. 不要缓存 /api/：响应里都是当前状态（列表、配额、回收站、进度）。
#
# 另外要透传 X-Forwarded-For / X-Real-IP，并在 homevault 管理页面打开
# 「信任反向代理」，否则审计日志里记录的会是 Nginx 的 IP。
# =============================================================================

# 上游：homevault 本体。
# config.ini 里建议写 listen = "127.0.0.1:8080"，只对反代开放。
upstream homevault_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# -----------------------------------------------------------------------------
# HTTP → HTTPS 跳转
# -----------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name drive.example.com;

    # 证书校验路径放行（用 certbot --webroot 申请证书时需要）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS 主站
# -----------------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name drive.example.com;

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/drive.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drive.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- 上传相关的关键设置 ----
    # 0 = 不限。上传上限由 homevault 的 maxUploadSize / 配额决定，
    # 让 Nginx 返回 413 只会让用户看到一个没有上下文的错误。
    client_max_body_size 0;

    # 请求体读取超时：慢速网络传大文件时放宽
    client_body_timeout  3600s;
    client_header_timeout 60s;
    send_timeout         3600s;

    # 不要在反代层请求 gzip 后再压缩上传流
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- 安全响应头 ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;
    server_tokens off;

    # ---- 默认位置：静态资源 + 各类非 /api 请求 ----
    location / {
        proxy_pass http://homevault_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 关键：不缓冲请求体（否则分片上传会被 Nginx 先落盘再转发）
        proxy_request_buffering off;
        proxy_buffering         off;

        # 长传输
        proxy_connect_timeout 60s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;

        # 长连接复用（配合 upstream 里的 keepalive 32）
        proxy_set_header Connection "";
    }

    # ---- /api/：同样的转发规则，另外显式禁止缓存 ----
    location /api/ {
        proxy_pass http://homevault_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_request_buffering off;
        proxy_buffering         off;

        proxy_connect_timeout 60s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;

        proxy_set_header Connection "";

        # 不缓存：列表、配额用量、回收站、上传进度、审计日志都是"当前状态"
        proxy_no_cache     1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # ---- Office→PDF 预览可能要转换几十秒，单独放宽 ----
    location /api/preview/office {
        proxy_pass http://homevault_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_read_timeout     300s;
        proxy_send_timeout     300s;
        proxy_set_header Connection "";

        proxy_no_cache     1;
        proxy_cache_bypass 1;
    }

    # ---- 上传接口：超时给到最大，避免大文件被中间切断 ----
    location /api/upload/ {
        proxy_pass http://homevault_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_connect_timeout   60s;
        proxy_read_timeout      7200s;
        proxy_send_timeout      7200s;
        proxy_set_header Connection "";
    }

    # ---- 下载：支持 Range，务必不要缓冲响应体 ----
    location /api/fs/download {
        proxy_pass http://homevault_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_set_header Connection "";
    }
}
